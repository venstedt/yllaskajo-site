# Päivittää Varaa-sivun saatavuuskalenterin (assets/availability.json)
# Ylläs Kajon kalenterista. Kalenterin iCal-osoite on repon salaisuudessa ICAL_URLS.
name: Päivitä saatavuus

on:
  schedule:
    - cron: "17 * * * *"   # kerran tunnissa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hae varaukset
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python3 tools/fetch_availability.py
      - name: Tallenna muutokset
        run: |
          if [ -z "$(git status --porcelain -- assets/availability.json)" ]; then
            echo "Ei muutoksia"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/availability.json
          git commit -m "Päivitä saatavuus"
          git push
